<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha de Emergência</title>
<script>
/* ===== EDITE SOMENTE ESTA PARTE ===== */
const ficha = {
 nome: "João Vicente",
 nascimento: "20/03/2020",
 tipoSanguineo: "O+",
 telefonePrincipal: "5521964196900",
 responsavelPrincipal: "Fernanda Neves",
 telefonePrincipalExibicao: "(21) 96419-6900",
 responsavelAlternativo: "Sidnei Júnior",
 telefoneAlternativoExibicao: "(21) 97909-8054",
 alergias: "Não possui alergias.",
 cuidados: "Não administrar medicamentos sem contato com o responsável.",
 condicoesMedicas: "Bronquite e asma",
 observacoes: "Em caso de emergência, entrar em contato imediatamente com um dos responsáveis.",
 informacaoImportante: "Informação importante",
 avatar: "👦🏻"
};
/* ===== NÃO PRECISA ALTERAR ABAIXO ===== */
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f6;color:#252a36}.top{background:#c92f3d;color:#fff;text-align:center;padding:28px 18px 34px}.top h1{font-size:20px}.cross{font-size:34px;font-weight:bold}.card{max-width:520px;margin:-16px auto 30px;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0002}.profile{text-align:center;padding:30px 22px 16px}.avatar{width:82px;height:82px;border:3px solid #c92f3d;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:auto;font-size:42px}.name{font-size:21px;font-weight:800;margin:18px 0 5px}.sub{font-size:13px;color:#7a8290}.badge{display:inline-block;padding:6px 10px;border-radius:15px;font-size:12px;margin:12px 3px 3px;background:#e8f6ee;color:#26734d}.alert{background:#fde8eb;color:#a52838}.actions{display:flex;gap:10px;padding:0 18px 20px}.btn{flex:1;text-decoration:none;color:#fff;text-align:center;font-weight:bold;padding:16px 8px;border-radius:10px;font-size:14px}.call{background:#df2e35}.whatsapp{background:#16a34a}.section{margin:0 18px 18px;padding:20px;border-radius:12px;background:#f7f8fb}.urgent{background:#fff4f5}.section h2{font-size:19px;color:#a52838;margin:0 0 18px}.item{margin:14px 0}.item strong{display:block;font-size:14px;margin-bottom:4px}.item span{font-size:13px;color:#6d7480;line-height:1.45}.footer{text-align:center;color:#8a9099;font-size:11px;padding:2px 20px 22px}@media(max-width:480px){.card{margin:-16px 10px 20px}}
</style></head>
<body><header class="top"><div class="cross">✚</div><h1>FICHA DE EMERGÊNCIA</h1></header>
<main class="card"><section class="profile"><div class="avatar" id="avatar"></div><div class="name" id="nome"></div><div class="sub" id="basicos"></div><span class="badge">Ficha ativa</span><span class="badge alert" id="info"></span></section>
<div class="actions"><a class="btn call" id="ligar">☎ Ligar para o responsável</a><a class="btn whatsapp" id="whatsapp">● WhatsApp</a></div>
<section class="section urgent"><h2>⚠ Atenção imediata</h2><div class="item"><strong>🩹 Alergias</strong><span id="alergias"></span></div><div class="item"><strong>⚠ Cuidados importantes</strong><span id="cuidados"></span></div><div class="item"><strong>🩺 Condições médicas</strong><span id="condicoes"></span></div></section>
<section class="section"><h2>👨‍👩‍👧 Contato de emergência</h2><div class="item"><strong>Responsável</strong><span id="principal"></span></div><div class="item"><strong>Contato alternativo</strong><span id="alternativo"></span></div><div class="item"><strong>Observações</strong><span id="observacoes"></span></div></section>
<div class="footer">Ficha de emergência • JV.PRIME3D<br>Informações fornecidas pelo responsável.</div></main>
<script>
avatar.textContent=ficha.avatar;nome.textContent=ficha.nome;basicos.textContent=`Nascimento: ${ficha.nascimento} • Tipo sanguíneo: ${ficha.tipoSanguineo}`;info.textContent=ficha.informacaoImportante;alergias.textContent=ficha.alergias;cuidados.textContent=ficha.cuidados;condicoes.textContent=ficha.condicoesMedicas;principal.textContent=`${ficha.responsavelPrincipal} • ${ficha.telefonePrincipalExibicao}`;alternativo.textContent=`${ficha.responsavelAlternativo} • ${ficha.telefoneAlternativoExibicao}`;observacoes.textContent=ficha.observacoes;ligar.href=`tel:+${ficha.telefonePrincipal}`;whatsapp.href=`https://wa.me/${ficha.telefonePrincipal}`;
</script></body></html>
